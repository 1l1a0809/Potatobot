{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "potatobot.fullname" . }}
  labels:
    {{- include "potatobot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "potatobot.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis
        - protocol: TCP
          port: 53   # DNS
        - protocol: UDP
          port: 53   # DNS
    - to: []
      ports:
        - protocol: TCP
          port: 443  # HTTPS for external APIs (Telegram, Sentry)
        - protocol: TCP
          port: 80   # HTTP