apiVersion: v1
kind: Secret
metadata:
  name: {{ include "potatobot.fullname" . }}-secrets
  labels:
    {{- include "potatobot.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.botToken }}
  bot-token: {{ .Values.secrets.botToken | b64enc }}
  {{- end }}
  {{- if .Values.secrets.databaseUrl }}
  database-url: {{ .Values.secrets.databaseUrl | b64enc }}
  {{- end }}
  {{- if .Values.secrets.postgresPassword }}
  postgres-password: {{ .Values.secrets.postgresPassword | b64enc }}
  {{- end }}
  {{- if .Values.secrets.sentryDsn }}
  sentry-dsn: {{ .Values.secrets.sentryDsn | b64enc }}
  {{- end }}
  {{- if .Values.secrets.adminSessionSecret }}
  admin-session-secret: {{ .Values.secrets.adminSessionSecret | b64enc }}
  {{- end }}
  {{- if .Values.bot.adminUserIds }}
  admin-user-ids: {{ .Values.bot.adminUserIds | b64enc }}
  {{- end }}