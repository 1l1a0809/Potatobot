version: "3.9"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: potatobot
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONPATH=/app
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Optional: PostgreSQL for local development
  postgres:
    image: postgres:16-alpine
    container_name: potatobot-db
    environment:
      POSTGRES_USER: potatobot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: potatobot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potatobot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: