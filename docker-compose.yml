version: "3.9"

services:
  bot:
    build:
      context: .
      dockerfile: dockerfile
      target: runtime
    container_name: potatobot
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONPATH=/app
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M